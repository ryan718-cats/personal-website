        <div class="window-body">
          <div class="page-body">
            <a class="back-link" href="index.html">← Ryan's desktop</a>
            <h1>Scientific Explorations</h1>
            <p class="lede">A shelf for experiments, clinical tools, and things worth figuring out.</p>

            <div class="exploration-gallery">
              <figure class="exploration-card">
                <img src="assets/clinical-annotation-gui.png" alt="Clinical EEG annotation interface showing neurophysiological waveforms and electrode channels">
                <figcaption>
                  <span>01</span>
                  <h2>GUI for easy clinical annotations of neurophysiological patterns</h2>
                </figcaption>
              </figure>

              <figure class="exploration-card">
                <img src="assets/epilepsy-risk-calculator.png" alt="Seizure control risk calculator showing an estimated probability">
                <figcaption>
                  <span>02</span>
                  <h2>Creating a clinical calculator website for neurologists after analyzing 1,300 epilepsy patients for clinical notes and brain abnormalities</h2>
                </figcaption>
              </figure>

              <figure class="exploration-card">
                <img src="assets/family-brainwaves-classification.png" alt="EEG collection setup and brain wave classification analysis">
                <figcaption>
                  <span>03</span>
                  <h2>Collecting brain waves from my family members and creating a website for brain wave classification</h2>
                </figcaption>
              </figure>

              <figure class="exploration-card exploration-pair">
                <div class="exploration-pair-images">
                  <img src="assets/deep-brain-stimulation-location.png" alt="Brain stimulation location analysis in epilepsy patients">
                  <img src="assets/deep-brain-stimulation-classifier.png" alt="Deep brain stimulation success classifier results">
                </div>
                <figcaption>
                  <span>04</span>
                  <h2>Deep brain stimulation in epilepsy patients</h2>
                </figcaption>
              </figure>

              <figure class="exploration-card">
                <img src="assets/visual-assistance-shoes.png" alt="Diagram of visual assistance shoes using location and obstacle sensors">
                <figcaption>
                  <span>05</span>
                  <h2>Visual Assistance Shoes <em>(patent)</em></h2>
                </figcaption>
              </figure>

              <figure class="exploration-card">
                <img src="assets/makerspace-circuits.jpg" alt="Arduino and breadboard circuit being assembled on a makerspace table">
                <figcaption>
                  <span>06</span>
                  <h2>Creating circuits with a high school student through makerspace</h2>
                </figcaption>
              </figure>
            </div>
          </div>
        </div>
